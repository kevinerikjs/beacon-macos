name: Bug report
description: Something in Beacon is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem instead? Do not file it here. See [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations: { required: true }
  - type: input
    id: beacon-version
    attributes:
      label: Beacon version
      description: Menu bar icon, then About.
    validations: { required: true }
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations: { required: true }
  - type: input
    id: ios-version
    attributes:
      label: Beam iOS version, if the problem involves streaming
  - type: textarea
    id: network
    attributes:
      label: Network setup
      description: Same WiFi, wired, VPN, guest network, anything unusual. Most streaming bugs turn out to live here.
